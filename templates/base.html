<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dit - IES Gonzalo Nazareno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{SITE_URL}}/static/css/custom.css" rel="stylesheet">
    {% block css %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{SITE_URL}}/">Gestiona</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar"
                    aria-controls="navbar" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                {% block menu %}{% endblock %}
                {% block login %}{% endblock %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block contenido %}{% endblock %}

        <hr>

        <footer>
            <div class="row">
                <div class="col-lg-12">
                    <p class="text-muted">dit IESGN 2025</p>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block js %}{% endblock %}

</body>

</html>
