{% extends "t1bloque.html" %}
{% block content %}

<div class="row">
    <div class="col-md-8 offset-md-2">
        <h3>Personas de contacto de {{ empresa.nombre }}</h3>

        <form method="post" class="mb-4">
            {% csrf_token %}
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Nombre</label>
                <div class="col-sm-8">
                    <input type="text" name="nombre" placeholder="Nombre completo" class="form-control" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Teléfono</label>
                <div class="col-sm-4">
                    <input type="text" name="telefono" placeholder="Teléfono" class="form-control">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Correo</label>
                <div class="col-sm-6">
                    <input type="email" name="email" placeholder="Correo electrónico" class="form-control">
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="bi bi-plus"></i> Añadir contacto
                </button>
                <a href="{{SITE_URL}}/empresas/" class="btn btn-secondary btn-lg ms-2">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>
        </form>

        <table class="table table-bordered table-hover table-sm">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th class="text-center" style="width:80px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for c in contactos %}
                <tr>
                    <td>{{ c.nombre }}</td>
                    <td>{{ c.telefono }}</td>
                    <td>{{ c.email }}</td>
                    <td class="text-center">
                        <a href="{{SITE_URL}}/empresas/contacto/{{ c.id }}/borrar/"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro que deseas eliminar este contacto?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4"><em>No hay personas de contacto.</em></td></tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="text-center mt-3">
            <a href="{{SITE_URL}}/empresas/" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>
</div>

{% endblock %}
