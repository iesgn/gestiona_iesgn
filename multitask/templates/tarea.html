{% extends "t1bloque.html" %}

{% block content %}
<div class="col-md-6">
    <h2>Redmine Multitask</h2>
    <form method="post">
        {% csrf_token %}
        <fieldset>
            <legend>Nueva Tarea — Proyecto: {{ nombreproyecto }}</legend>

            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input class="form-control" type="text" id="title" name="tittle" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea rows="10" class="form-control" id="bio" name="desc" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoría:</label>
                <select class="form-select" id="categoria" name="categoria">
                    {% for p in categorias %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha fin:</label>
                <input class="form-control" type="text" name="fecha2" pattern="\d{1,2}/\d{1,2}/\d{4}">
            </div>

            <div class="mb-2">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="opcion" value="grupo" checked id="opcionGrupo">
                    <label class="form-check-label" for="opcionGrupo">Seleccionar por grupo</label>
                </div>
                <select class="form-select mt-1" name="grupo">
                    {% for p in grupos %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="opcion" value="alumno" id="opcionAlumno">
                    <label class="form-check-label" for="opcionAlumno">Seleccionar por alumnos</label>
                </div>
                {% for p in usuarios %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="alumnos" value="{{ p.user.id }}" id="alumno_{{ p.user.id }}">
                        <label class="form-check-label" for="alumno_{{ p.user.id }}">{{ p.user.name }}</label>
                    </div>
                {% endfor %}
            </div>

            <input type="hidden" name="paso" value="step3">
            <input type="hidden" name="idproyecto" value="{{ idproyecto }}">
            <input type="hidden" name="nombreproyecto" value="{{ nombreproyecto }}">
            <button class="btn btn-primary" type="submit">Siguiente</button>
        </fieldset>
    </form>
</div>
{% endblock %}
