{% extends "t1bloque.html" %}

{% block content %}
<div class="col-md-6">
    <h2>Redmine Multitask</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Proyecto:</label>
            <select name="proyecto" class="form-select">
                {% for p in proyectos %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <input type="hidden" name="paso" value="step2">
        <button class="btn btn-primary" type="submit">Siguiente</button>
    </form>
</div>
{% endblock %}
